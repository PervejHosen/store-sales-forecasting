<style>
:root {
  --navy: #1D4A35; --ink: #16382A; --muted: #4F5E52; --faint: #66766A; --line: #DCCFB6; --grid: #E9E0CE;
  --bg: #EEE5D4; --card: #F7F1E6; --accent: #1D4A35; --accent-2: #B87318; --tomato: #F2462E;
  --s1: #1D4A35; --s2: #B87318; --s3: #F2462E; --s4: #7D8D99;
  --radius: 14px; --shadow: 0 10px 30px -22px rgba(29, 74, 53, .4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* top bar + hero */
.top { background: var(--navy); color: #EEE5D4; }
.top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; font-size: .92rem; }
.top-bar a { color: #EEE5D4; text-decoration: none; font-weight: 600; }
.top-bar a:hover { color: #FF9A85; }
.top-bar .gh { border: 1px solid rgba(238, 229, 212, .4); border-radius: 999px; padding: 6px 14px; white-space: nowrap; }
.hero { padding: 36px 0 56px; }
.kicker { font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #FF9A85; }
.hero h1 { font-size: clamp(1.9rem, 4.4vw, 3rem); line-height: 1.12; letter-spacing: -.02em; font-weight: 800; color: #F6F0E4; margin: 10px 0 14px; max-width: 820px; }
.hero h1 span { background: linear-gradient(90deg, #FF8A73, #FF8A73); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: #D9D2C2; max-width: 760px; font-size: 1.05rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.chips span { font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #F6F0E4; border: 1px solid rgba(238, 229, 212, .3); background: rgba(238, 229, 212, .08); border-radius: 999px; padding: 4px 11px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: -34px; position: relative; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.kpi b { display: block; font-size: 1.85rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.kpi span { color: var(--muted); font-size: .88rem; }
@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* sections */
section { margin-top: 56px; }
h2 { font-size: 1.55rem; letter-spacing: -.01em; font-weight: 800; margin-bottom: 6px; }
.lead { color: var(--muted); max-width: 780px; margin-bottom: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
.card h3 { font-size: 1.02rem; font-weight: 700; }
.card .sub { color: var(--faint); font-size: .86rem; margin: 2px 0 14px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* findings */
.findings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.finding { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--tomato); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.finding b { display: block; font-size: 1.5rem; font-weight: 800; color: var(--ink); line-height: 1.2; }
.finding p { color: var(--muted); font-size: .95rem; margin-top: 4px; }
@media (max-width: 760px) { .findings { grid-template-columns: minmax(0, 1fr); } }

/* charts */
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: inherit; }
.axis text, .tick { fill: var(--faint); font-size: 11px; }
.lbl { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.lbl-muted { fill: var(--muted); font-size: 11px; }
.hit { cursor: default; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.scroll svg { min-width: 640px; }
.moves { list-style: none; display: grid; gap: 12px; }
.moves li { padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); font-size: .93rem; }
.moves li b { color: var(--ink); }
.rules td, .rules th { text-align: left !important; }
.scale { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--faint); margin-top: 10px; }
.scale .bar { width: 140px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #F1EADB, #1D4A35); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--navy); color: #f1f5f9; font-size: .82rem; line-height: 1.45; padding: 8px 11px; border-radius: 8px; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); opacity: 0; transition: opacity .12s; max-width: 260px; }
#tip b { color: #fff; }

/* tables */
details { margin-top: 14px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: .9rem; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; margin-top: 10px; }
th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--faint); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }

/* actions */
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .actions { grid-template-columns: minmax(0, 1fr); } }
.action { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.action .tag { display: inline-block; font-size: .7rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; margin-bottom: 8px; }
.tag.p1 { background: #FBD9D2; color: #B8301C; } .tag.p2 { background: #fef3c7; color: #92400e; } .tag.p3 { background: #DCE8DF; color: #1D4A35; }
.action h3 { font-size: 1.02rem; }
.action .seg { color: var(--faint); font-size: .84rem; margin: 2px 0 8px; }
.action p { color: var(--muted); font-size: .92rem; }

/* method */
.pipe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .pipe { grid-template-columns: minmax(0, 1fr); } }
.layer { border-radius: 12px; padding: 16px 18px; border: 1px solid var(--line); background: var(--card); }
.layer h4 { font-size: .95rem; margin-bottom: 4px; }
.layer p, .layer li { color: var(--muted); font-size: .88rem; }
.layer ul { padding-left: 18px; margin-top: 4px; }
.layer.b { border-top: 4px solid #b45309; } .layer.s { border-top: 4px solid #64748b; } .layer.g { border-top: 4px solid #ca8a04; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; background: #E9E0CE; padding: 1px 5px; border-radius: 4px; }
.note { color: var(--faint); font-size: .84rem; margin-top: 10px; }
footer { margin: 64px 0 40px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--faint); font-size: .88rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
@media (max-width: 560px) { .card, .finding, .action { padding: 16px; } .kpi b { font-size: 1.5rem; } }
</style>
